plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.github.cnosmn.bigbluebuttonmobile.bbbnative'
version = '0.1.0'

android {
  namespace "io.github.cnosmn.bigbluebuttonmobile.bbbnative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // Applied to any app that minifies with R8.
    consumerProguardFiles 'proguard-rules.pro'
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Native WebRTC for publishing the screen (Google's org.webrtc API, prebuilt by webrtc-sdk).
  implementation 'io.github.webrtc-sdk:android:150.7871.01'
}
